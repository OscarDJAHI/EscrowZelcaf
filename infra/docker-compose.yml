# Escrow — full local stack.
# Prérequis (Story 1.2) : cp infra/.env.example infra/.env  (jamais versionné)
# puis :  docker compose -f infra/docker-compose.yml up --build
# Sans .env, compose échoue en nommant la variable manquante (syntaxe :?).
#
# Ingress (Story 1.4) : tout passe par le reverse-proxy TLS (service frontend).
#   Accès local : https://localhost:8443  (HTTP :8080 -> redirigé HTTPS).
#   Le backend n'est PAS publié — joignable seulement via /api sur le proxy.
name: escrow-poc

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: escrow
      POSTGRES_USER: escrow
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD manquant — cp infra/.env.example infra/.env}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U escrow -d escrow"]
      interval: 5s
      timeout: 3s
      retries: 10

  adminer:
    image: adminer:4
    ports:
      - "8081:8080"
    environment:
      ADMINER_DEFAULT_SERVER: postgres
    depends_on:
      postgres:
        condition: service_healthy

  pgadmin:
    image: dpage/pgadmin4:8
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@escrow.com
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:?PGADMIN_DEFAULT_PASSWORD manquant}
      PGADMIN_CONFIG_SERVER_MODE: "False"
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: "False"
    ports:
      - "5050:80"
    volumes:
      - pgadmin-data:/var/lib/pgadmin
      - ./pgadmin/servers.json:/pgadmin4/servers.json:ro
    depends_on:
      postgres:
        condition: service_healthy

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:-escrow}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:?RABBITMQ_DEFAULT_PASS manquant}
    ports:
      - "5672:5672"    # AMQP
      - "15672:15672"  # management UI
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-escrow-storage}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD manquant}
    ports:
      - "9000:9000"    # S3 API
      - "9001:9001"    # console UI
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 10

  # One-shot: creates the evidence bucket, then exits 0.
  minio-init:
    image: minio/mc:RELEASE.2025-08-13T08-35-41Z
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-escrow-storage}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD manquant}
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 \"$$MINIO_ROOT_USER\" \"$$MINIO_ROOT_PASSWORD\" &&
      mc mb --ignore-existing local/escrow-evidence
      "

  # Analyse anti-malware à l'ingestion (Story 1.8, NFR-P7). Sans ce service,
  # TOUT dépôt de fichier échoue en 502 SCAN_UNAVAILABLE : c'est voulu (fail-closed,
  # aucun interrupteur de désactivation), et c'est pourquoi le backend l'attend
  # explicitement via depends_on ci-dessous. Exploitation : Docs/runbook-antivirus-ingestion.md
  clamav:
    # Variante « _base » : l'image ne PORTE PAS les bases virales (revue 1.8 —
    # vérifié : image ~79 Mo, /var/lib/clamav vide, et l'/init de l'image lance
    # freshclam dès que le dossier est vide). Le premier démarrage télécharge donc
    # ~113 Mo (main + daily + bytecode) AVANT que clamd n'écoute. C'est le volume
    # nommé ci-dessous qui rend les démarrages suivants hors ligne, pas l'image.
    image: clamav/clamav:1.4.3_base
    environment:
      # Coupe le DAEMON de mise à jour, pas le téléchargement initial (celui-ci est
      # inconditionnel quand /var/lib/clamav est vide). Le nom exact compte : l'image
      # lit CLAMAV_NO_FRESHCLAMD (avec un D final) — la variante sans D, posée
      # jusqu'ici, n'était lue par personne et freshclam tournait quand même.
      CLAMAV_NO_FRESHCLAMD: "true"
      # Plafond de flux INSTREAM. DOIT rester au-dessus de la limite métier de 10 Mo
      # par fichier (PlatformLimits) : en dessous, clamd coupe la connexion en cours
      # d'envoi et des fichiers parfaitement légitimes échouent en 502. Posé ici
      # explicitement plutôt que laissé au défaut de l'image (25 Mo), pour que
      # l'invariant soit vérifiable dans le dépôt et non seulement affirmé.
      CLAMAV_STREAM_MAX_LENGTH: "26214400"
    volumes:
      # Persiste les bases virales entre recréations de conteneur. Sans lui, chaque
      # `docker compose up --build` re-télécharge ~113 Mo et, réseau lent, dépasse le
      # budget du healthcheck ci-dessous : le backend étant gaté par
      # `depends_on: service_healthy`, la stack ENTIÈRE refuse alors de démarrer —
      # au lieu de dégrader proprement en 502 SCAN_UNAVAILABLE.
      - clamavdb:/var/lib/clamav
    expose:
      - "3310"
    # Un clamd mort doit revenir seul : sinon 502 permanent sur les TROIS routes
    # d'upload, et la file offline du frontend se bouche derrière le premier échec
    # transitoire, bloquant même les actions sans rapport.
    restart: unless-stopped
    # Budget = start_period + retries × interval. Le premier démarrage cumule le
    # téléchargement des bases (~113 Mo) ET leur chargement en mémoire ; 240 s ne
    # suffisaient pas sur un lien lent. Les démarrages suivants, volume peuplé, ne
    # paient que le chargement (~30 s) et n'utilisent pas ce budget.
    healthcheck:
      test: ["CMD", "clamdcheck.sh"]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 300s
    # clamd charge l'intégralité des signatures en mémoire (~1,3 Go aujourd'hui).
    # La borne est documentée haut : sous ~1,5 Go le processus est tué par l'OOM
    # killer pendant le chargement, et le symptôme (conteneur qui redémarre en
    # boucle, jamais healthy) ne dit pas qu'il s'agit de mémoire.
    mem_limit: 2g

  # Collecteur SMTP local (Story 2.4, décision T0 : « adaptateur de développement »).
  #
  # POURQUOI IL EXISTE : sans transport, l'OTP d'inscription ne quitte jamais le
  # processus backend — le parcours est complet côté serveur mais INFINISSABLE dans
  # l'IHM, faute de pouvoir lire le code. Mailpit capte le message et l'affiche.
  #
  # CE QU'IL N'EST PAS : un fournisseur d'e-mail. Il ne RELAIE rien vers l'extérieur ;
  # tout message entrant reste dans sa boîte en mémoire. Le choix du prestataire de
  # production appartient au spike 8.1 (délivrabilité par corridor ZLECAf, coûts,
  # conformité) et n'est en rien préempté ici : SMTP est un protocole.
  #
  # LECTURE DE L'OTP : http://localhost:8025 (UI web). C'est la seule voie prévue —
  # l'interdiction ferme de T0 tient, aucun endpoint de lecture d'OTP n'existe côté
  # application, et il ne doit jamais en exister, fût-il gardé par un profil.
  mailpit:
    image: axllent/mailpit:v1.21
    environment:
      # Boîte en mémoire, purgée à l'arrêt : aucune donnée personnelle ne persiste
      # sur le poste après un `down`, et rien à sauvegarder.
      MP_MAX_MESSAGES: "500"
      MP_SMTP_AUTH_ACCEPT_ANY: "true"
      MP_SMTP_AUTH_ALLOW_INSECURE: "true"
    ports:
      # 1025 = SMTP (le backend y écrit) ; 8025 = UI web (vous y lisez le code).
      - "${MAILPIT_SMTP_PORT:-1025}:1025"
      - "${MAILPIT_UI_PORT:-8025}:8025"
    healthcheck:
      # L'image est distroless : ni wget ni curl. Mailpit embarque sa propre sonde.
      test: ["CMD", "/mailpit", "readyz"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: ../backend
    environment:
      # Transport e-mail (Story 2.4). `smtp` ici parce que cette stack est le poste
      # de développement : c'est ce qui rend l'inscription finissable dans l'IHM.
      # Le défaut du code reste `outbox` — un déploiement qui ne dit rien ne livre rien.
      ESCROW_MAIL_TRANSPORT: ${ESCROW_MAIL_TRANSPORT:-smtp}
      SPRING_MAIL_HOST: mailpit
      SPRING_MAIL_PORT: "1025"
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/escrow
      SPRING_DATASOURCE_USERNAME: escrow
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD manquant}
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_PORT: "5672"
      SPRING_RABBITMQ_USERNAME: ${RABBITMQ_DEFAULT_USER:-escrow}
      SPRING_RABBITMQ_PASSWORD: ${RABBITMQ_DEFAULT_PASS:?RABBITMQ_DEFAULT_PASS manquant}
      ESCROW_JWT_SECRET: ${ESCROW_JWT_SECRET:?ESCROW_JWT_SECRET manquant (>= 32 octets)}
      ESCROW_STORAGE_ENDPOINT: http://minio:9000
      ESCROW_STORAGE_BUCKET: escrow-evidence
      ESCROW_STORAGE_ACCESS_KEY: ${MINIO_ROOT_USER:-escrow-storage}
      ESCROW_STORAGE_SECRET_KEY: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD manquant}
      # Chiffrement au repos (Story 1.7) : sans le trousseau, plus rien de ce qui a
      # été chiffré n'est relisible — ces clés se sauvegardent comme un backup.
      # active-key-id reste vide tant qu'il n'y a qu'une clé (déduite) ; on ne le
      # renseigne que pendant une rotation (cf. runbook).
      ESCROW_CRYPTO_KEYS: ${ESCROW_CRYPTO_KEYS:?ESCROW_CRYPTO_KEYS manquant (format id:cle_base64, 32 octets)}
      ESCROW_CRYPTO_ACTIVE_KEY_ID: ${ESCROW_CRYPTO_ACTIVE_KEY_ID:-}
      # Analyse anti-malware (Story 1.8) : ni l'hôte ni le port ne sont des secrets,
      # d'où des valeurs en clair ici et non des variables du .env. Les timeouts sont
      # paramétrables pour un clamd lent (poste chargé) sans reconstruire l'image.
      ESCROW_ANTIVIRUS_HOST: clamav
      ESCROW_ANTIVIRUS_PORT: "3310"
      ESCROW_ANTIVIRUS_CONNECT_TIMEOUT_MS: ${ESCROW_ANTIVIRUS_CONNECT_TIMEOUT_MS:-2000}
      ESCROW_ANTIVIRUS_READ_TIMEOUT_MS: ${ESCROW_ANTIVIRUS_READ_TIMEOUT_MS:-30000}
      # Optionnels (Story 1.1) — vides = aucun ADMIN créé au démarrage.
      ESCROW_BOOTSTRAP_ADMIN_EMAIL: ${ESCROW_BOOTSTRAP_ADMIN_EMAIL:-}
      ESCROW_BOOTSTRAP_ADMIN_PASSWORD: ${ESCROW_BOOTSTRAP_ADMIN_PASSWORD:-}
      # Surface d'API (Story 1.5) — passe-plats, VIDES par défaut : cette stack
      # reste local/staging en mode dev (Swagger ouvert, CORS permissif). Poser
      # SPRING_PROFILES_ACTIVE=prod + ESCROW_CORS_ALLOWED_ORIGINS dans le .env
      # bascule le durcissement sans éditer ce fichier ; le backend refusera alors
      # de démarrer si l'allowlist est absente ou permissive.
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-}
      ESCROW_CORS_ALLOWED_ORIGINS: ${ESCROW_CORS_ALLOWED_ORIGINS:-}
    # Pas de publication de port (Story 1.4) : le backend n'est joignable QUE via
    # le reverse-proxy TLS (frontend), sur le réseau interne compose. C'est la
    # frontière de confiance qui rend X-Forwarded-For fiable (résolution DEF2).
    expose:
      - "8080"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      # Not just "minio healthy": on a fresh volume the bucket only exists once
      # minio-init has run, and a backend started before that would 500 on the
      # first upload with NoSuchBucket.
      minio-init:
        condition: service_completed_successfully
      # Attente explicite (Story 1.8) : le scan est fail-closed, donc un backend
      # démarré avant clamd refuserait tout dépôt en 502. Le healthcheck de clamav
      # a un start_period de 120 s — le premier `up` est donc plus long qu'avant,
      # et c'est le prix de l'absence d'interrupteur.
      clamav:
        condition: service_healthy
      # Pas fail-closed comme clamav : un transport muet n'échoue PAS l'inscription
      # (contrat du port), la ligne d'outbox reste simplement non livrée. L'attente
      # est là pour éviter que les premiers OTP de la session partent dans le vide.
      mailpit:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health | grep -q UP"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s

  # Reverse-proxy TLS + PWA (Story 1.4) : ingress unique de la stack.
  frontend:
    build:
      context: ../frontend
      args:
        # Vide = appels API en MÊME ORIGINE (/api/v1/...), proxifiés vers le
        # backend par nginx. Plus d'appel HTTP direct au backend depuis le PWA.
        VITE_API_BASE: ""
    ports:
      # Redirection HTTP -> HTTPS sur le port HTTP, PWA + API sur le port HTTPS.
      # Ports hôte paramétrables (défauts hors des collisions connues 8080/5432).
      - "${INGRESS_HTTP_PORT:-8080}:80"
      - "${INGRESS_HTTPS_PORT:-8443}:443"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  pgdata:
  pgadmin-data:
  miniodata:
  # Bases virales ClamAV (revue 1.8) : l'image « _base » ne les embarque pas, ce
  # volume est donc ce qui évite ~113 Mo de téléchargement à chaque recréation.
  clamavdb:
