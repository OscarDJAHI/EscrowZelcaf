spring:
  application:
    name: escrow-core

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/escrow}
    username: ${SPRING_DATASOURCE_USERNAME:escrow}
    password: ${SPRING_DATASOURCE_PASSWORD}  # REQUIS — aucun défaut (Story 1.2, NFR-P1)

  jpa:
    hibernate:
      ddl-auto: none              # schema is owned by Flyway migrations
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    baseline-on-migrate: true

  rabbitmq:
    host: ${SPRING_RABBITMQ_HOST:localhost}
    port: ${SPRING_RABBITMQ_PORT:5672}
    username: ${SPRING_RABBITMQ_USERNAME:escrow}  # aligné sur le compose (guest est de toute façon restreint à localhost)
    password: ${SPRING_RABBITMQ_PASSWORD}  # REQUIS — aucun défaut (Story 1.2, NFR-P1)
    # Keep API responsive if the broker is unreachable at startup.
    connection-timeout: 3000ms

  servlet:
    multipart:
      # Deliberately set ABOVE the 10 MB per-file business limit so the service
      # arbitrates the real bound (0 < size <= 10 MB) and returns a clean 400.
      # The container cap only guards against absurd payloads; breaching it
      # surfaces as MaxUploadSizeExceededException -> 400 in the handler.
      max-file-size: 15MB
      max-request-size: 60MB

escrow:
  jwt:
    # REQUIS — aucun défaut. Must be >= 32 bytes for HS256.
    secret: ${ESCROW_JWT_SECRET}
    ttl-seconds: 86400

  storage:
    # S3-compatible object storage (MinIO) holding the evidence binaries.
    # secret-key REQUIS — aucun défaut (Story 1.2, NFR-P1).
    endpoint: ${ESCROW_STORAGE_ENDPOINT:http://localhost:9000}
    bucket: ${ESCROW_STORAGE_BUCKET:escrow-evidence}
    access-key: ${ESCROW_STORAGE_ACCESS_KEY:escrow-storage}  # identifiant (non secret), aligné sur le compose
    secret-key: ${ESCROW_STORAGE_SECRET_KEY}

  crypto:
    # Chiffrement au repos (Story 1.7, AD-29/NFR-P6). Le trousseau REQUIS — aucun
    # défaut : une clé par défaut équivaudrait à pas de chiffrement du tout.
    #
    # keys : « id:cléBase64 » séparés par des virgules, chaque clé faisant
    #   EXACTEMENT 32 octets une fois décodée (AES-256) — openssl rand -base64 32.
    #   Plusieurs clés cohabitent volontairement : les anciennes servent à relire
    #   les enveloppes qu'elles ont produites, la seule clé ACTIVE chiffre.
    # active-key-id : id de la clé de chiffrement. Vide = déduit quand le trousseau
    #   n'a qu'une clé (déploiement initial) ; OBLIGATOIRE dès qu'il y en a
    #   plusieurs, c'est-à-dire pendant une rotation — voir
    #   Docs/runbook-rotation-cles-chiffrement.md.
    keys: ${ESCROW_CRYPTO_KEYS}
    active-key-id: ${ESCROW_CRYPTO_ACTIVE_KEY_ID:}

  auth:
    password:
      # Politique de robustesse (Story 1.6, NFR-P5). Longueurs en OCTETS UTF-8 et
      # non en caracteres (revue 1.6) : c'est en octets que bcrypt tronque, un mot
      # de passe accentue de 56 caracteres pesant 96 octets etait auparavant
      # accepte puis tronque en silence. max-length ne peut pas depasser 72 ; toute
      # valeur incoherente (min > max, min-categories hors [1,4]) fait desormais
      # ECHOUER LE DEMARRAGE plutot que de tuer l'inscription en silence.
      # min-categories : nombre minimal parmi {minuscule, majuscule, chiffre,
      # symbole} — espaces et caracteres de controle ne comptent pour aucune.
      min-length: ${ESCROW_AUTH_PASSWORD_MIN_LENGTH:12}
      max-length: ${ESCROW_AUTH_PASSWORD_MAX_LENGTH:72}
      min-categories: ${ESCROW_AUTH_PASSWORD_MIN_CATEGORIES:3}
    ratelimit:
      # Anti-bruteforce (Story 1.3, NFR-P2). Seuil d'echecs par origine/compte,
      # verrou de base double a chaque salve jusqu'au plafond ; fenetre de
      # comptage au-dela de laquelle un echec ancien ne compte plus ; retention
      # et plafond dur bornant la memoire.
      max-attempts: ${ESCROW_AUTH_RATELIMIT_MAX_ATTEMPTS:5}
      base-lock-seconds: ${ESCROW_AUTH_RATELIMIT_BASE_LOCK_SECONDS:30}
      max-lock-seconds: ${ESCROW_AUTH_RATELIMIT_MAX_LOCK_SECONDS:900}
      counting-window-seconds: ${ESCROW_AUTH_RATELIMIT_COUNTING_WINDOW_SECONDS:900}
      retention-seconds: ${ESCROW_AUTH_RATELIMIT_RETENTION_SECONDS:3600}
      max-entries: ${ESCROW_AUTH_RATELIMIT_MAX_ENTRIES:100000}
      eviction-interval-ms: ${ESCROW_AUTH_RATELIMIT_EVICTION_INTERVAL_MS:300000}

  api:
    # Surface d'API (Story 1.5, NFR-P4). Valeurs ci-dessous = defauts de
    # DEVELOPPEMENT, pour que dev et CI restent pleinement utilisables ; le
    # durcissement est porte par le profil prod (application-prod.yml), jamais
    # par ces defauts. Les deux cles sont ecrites ici pour rester decouvrables
    # plutot que cachees dans des defauts d'annotation @Value.
    #
    # docs-exposed : true = matchers permitAll sur /v3/api-docs, /swagger-ui.
    #   Le profil prod le force a false ; ProductionApiSurfaceGuard refuse le
    #   demarrage si une variable d'environnement tentait de le rouvrir.
    docs-exposed: ${ESCROW_API_DOCS_EXPOSED:true}
    # cors-allowed-origins : liste d'origines separees par des virgules
    #   (scheme://hote[:port], sans chemin ni '/' final). VIDE = CORS permissif
    #   (setAllowedOriginPatterns "*"), acceptable hors production seulement.
    #   Non vide = comparaison EXACTE (setAllowedOrigins).
    cors-allowed-origins: ${ESCROW_CORS_ALLOWED_ORIGINS:}

  partner:
    # Anti-replay window for signed partner deposits: an X-Escrow-Timestamp more
    # than this many seconds away from server time is rejected (401).
    timestamp-tolerance-seconds: ${ESCROW_PARTNER_TIMESTAMP_TOLERANCE_SECONDS:300}
    # Bounded retention for the partner nonce store: a nonce older than
    # max(this, timestamp-tolerance-seconds) is safe to purge (its freshness
    # window has already closed). Default 900 s (>= the 300 s tolerance).
    nonce-retention-seconds: ${ESCROW_PARTNER_NONCE_RETENTION_SECONDS:900}
    # How often the scheduled purge runs (fixed delay, milliseconds).
    nonce-purge-interval-ms: ${ESCROW_PARTNER_NONCE_PURGE_INTERVAL_MS:60000}

server:
  port: ${SERVER_PORT:8080}
  # Derriere le reverse-proxy TLS (Story 1.4) qui termine le SSL : Spring derive
  # le schema d'origine de X-Forwarded-Proto (=> request.isSecure(), donc HSTS) et
  # l'IP client reelle de X-Forwarded-For, via ForwardedHeaderFilter. Consequence :
  # le rate-limiter (Story 1.3) cle sur l'IP client, jamais sur celle du proxy
  # (resolution du report DEF2). La confiance en X-Forwarded-For repose sur
  # l'isolation reseau : le backend n'est joignable QUE par le proxy (compose).
  forward-headers-strategy: framework

management:
  endpoints:
    web:
      exposure:
        include: health,info
