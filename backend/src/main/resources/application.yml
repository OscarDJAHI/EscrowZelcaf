spring:
  application:
    name: escrow-core

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/escrow}
    username: ${SPRING_DATASOURCE_USERNAME:escrow}
    password: ${SPRING_DATASOURCE_PASSWORD}  # REQUIS — aucun défaut (Story 1.2, NFR-P1)

  jpa:
    hibernate:
      ddl-auto: none              # schema is owned by Flyway migrations
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    baseline-on-migrate: true

  rabbitmq:
    host: ${SPRING_RABBITMQ_HOST:localhost}
    port: ${SPRING_RABBITMQ_PORT:5672}
    username: ${SPRING_RABBITMQ_USERNAME:escrow}  # aligné sur le compose (guest est de toute façon restreint à localhost)
    password: ${SPRING_RABBITMQ_PASSWORD}  # REQUIS — aucun défaut (Story 1.2, NFR-P1)
    # Keep API responsive if the broker is unreachable at startup.
    connection-timeout: 3000ms

  servlet:
    multipart:
      # Deliberately set ABOVE the 10 MB per-file business limit so the service
      # arbitrates the real bound (0 < size <= 10 MB) and returns a clean 400.
      # The container cap only guards against absurd payloads; breaching it
      # surfaces as MaxUploadSizeExceededException -> 400 in the handler.
      max-file-size: 15MB
      max-request-size: 60MB

escrow:
  jwt:
    # REQUIS — aucun défaut. Must be >= 32 bytes for HS256.
    secret: ${ESCROW_JWT_SECRET}
    ttl-seconds: 86400

  storage:
    # S3-compatible object storage (MinIO) holding the evidence binaries.
    # secret-key REQUIS — aucun défaut (Story 1.2, NFR-P1).
    endpoint: ${ESCROW_STORAGE_ENDPOINT:http://localhost:9000}
    bucket: ${ESCROW_STORAGE_BUCKET:escrow-evidence}
    access-key: ${ESCROW_STORAGE_ACCESS_KEY:escrow-storage}  # identifiant (non secret), aligné sur le compose
    secret-key: ${ESCROW_STORAGE_SECRET_KEY}

  partner:
    # Anti-replay window for signed partner deposits: an X-Escrow-Timestamp more
    # than this many seconds away from server time is rejected (401).
    timestamp-tolerance-seconds: ${ESCROW_PARTNER_TIMESTAMP_TOLERANCE_SECONDS:300}
    # Bounded retention for the partner nonce store: a nonce older than
    # max(this, timestamp-tolerance-seconds) is safe to purge (its freshness
    # window has already closed). Default 900 s (>= the 300 s tolerance).
    nonce-retention-seconds: ${ESCROW_PARTNER_NONCE_RETENTION_SECONDS:900}
    # How often the scheduled purge runs (fixed delay, milliseconds).
    nonce-purge-interval-ms: ${ESCROW_PARTNER_NONCE_PURGE_INTERVAL_MS:60000}

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info
