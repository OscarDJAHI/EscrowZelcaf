# Valeurs FACTICES de test (Story 1.2) : les secrets n'ont plus de défaut dans
# application.yml — les tests fournissent les leurs ici. Les connexions réelles
# (Postgres/MinIO) viennent des Testcontainers via @DynamicPropertySource, qui
# priment sur ces valeurs.
spring.datasource.password=test-only-password
spring.rabbitmq.password=test-only-password
escrow.jwt.secret=test-only-jwt-secret-32-bytes-minimum-padding!!
escrow.storage.secret-key=test-only-storage-secret
# Trousseau de chiffrement au repos (Story 1.7) : clé de test de 32 octets décodés
# ("escrow-test-only-key-32-bytes!!!"). SANS ces deux lignes, AUCUN contexte Spring
# de test ne démarre — SecretCipher refuse un trousseau absent, par conception.
escrow.crypto.keys=v1:ZXNjcm93LXRlc3Qtb25seS1rZXktMzItYnl0ZXMhISE=
escrow.crypto.active-key-id=v1
# Analyse anti-malware (Story 1.8) : hôte/port volontairement INJOIGNABLES et
# timeouts très courts. Le bean ClamavMalwareScanner est construit dans tout
# contexte @SpringBootTest (il ne se connecte qu'au moment du scan), mais aucune
# suite ne doit dépendre d'un clamd local : si un test finit par emprunter ce
# chemin, il échoue en 502 en quelques millisecondes au lieu d'attendre 30 s.
# Le protocole et le fail-closed sont prouvés contre un serveur INSTREAM factice
# (ClamavMalwareScannerTest) et contre un vrai clamd conteneurisé
# (ClamavMalwareScannerIntegrationTest), tous deux avec leurs propres réglages.
escrow.antivirus.host=127.0.0.1
escrow.antivirus.port=1
escrow.antivirus.connect-timeout-ms=200
escrow.antivirus.read-timeout-ms=500
