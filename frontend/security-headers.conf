# En-têtes de sécurité (Story 1.4, NFR-P3) — inclus au niveau du serveur ET
# ré-inclus dans chaque location qui pose son propre add_header (sw.js, manifest,
# assets), car nginx N'HÉRITE PAS les add_header d'un bloc parent dès qu'un
# add_header est présent au niveau courant. Centraliser ici garantit qu'aucune
# réponse ne perd silencieusement ses en-têtes.
#
# HSTS : n'a d'effet que sur les réponses HTTPS (posé dans le seul serveur TLS).
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
# CSP : politique restrictive pour le PWA (Vue/Vite). 'unsafe-inline' sur style-src
# couvre les styles injectés par Vue/Tailwind ; à resserrer après audit navigateur
# (vérification E2E, dette Story 11.7).
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
add_header X-Frame-Options "DENY" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
