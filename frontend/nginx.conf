# Reverse-proxy TLS de la stack compose local/staging (Story 1.4, NFR-P3).
# Ce nginx est l'INGRESS UNIQUE : il termine le TLS, sert le PWA et proxifie
# /api vers le backend (seul chemin vers le backend, non publié en clair).
# La cible d'hébergement de production (ingress définitif) est tranchée en
# Story 11.3 (spike AR-P5) et peut remplacer ce proxy.

# --- HTTP : tout rediriger en HTTPS (AC #1) ---
server {
    listen 80;
    server_name _;
    # 301 permanent : le HSTS servi côté HTTPS évitera ensuite le détour.
    return 301 https://$host$request_uri;
}

# --- HTTPS : terminaison TLS, PWA + proxy API, en-têtes de sécurité ---
server {
    listen 443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/certs/tls.crt;
    ssl_certificate_key /etc/nginx/certs/tls.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    root /usr/share/nginx/html;
    index index.html;

    # En-têtes de sécurité sur toutes les réponses (AC #1, #2).
    include /etc/nginx/snippets/security-headers.conf;

    # Proxy API : SEUL chemin vers le backend (AC #3). Le backend n'est pas publié
    # sur l'hôte (réseau interne compose) : cette frontière réseau est ce qui rend
    # X-Forwarded-For digne de confiance (résolution DEF2, Story 1.3).
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # ÉCRASE (ne concatène pas) X-Forwarded-For avec l'IP client réelle : un
        # X-Forwarded-For fourni par le client ne doit jamais être propagé.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
    }

    # Sondes de documentation d'API (Story 1.5, NFR-P4) : coupées net à l'ingress.
    # Sans ces locations, ces chemins tomberaient dans le fallback SPA ci-dessous et
    # renverraient le shell index.html en 200 — un 2xx qui contredit le critère
    # « 404/403 » observé depuis l'ingress, même quand le backend, lui, est fermé.
    # Le proxy ne route QUE /api/ : ces chemins n'atteignent de toute façon jamais
    # le backend, ce 404 est donc la réponse honnête.
    # Spécificité nginx : '=' (exact) prime sur '^~' (préfixe prioritaire), qui prime
    # lui-même sur le préfixe simple 'location /' — l'ordre d'écriture est indifférent.
    location = /swagger-ui.html { return 404; }
    location = /swagger-ui      { return 404; }
    location ^~ /swagger-ui/    { return 404; }
    location ^~ /v3/api-docs    { return 404; }

    # SPA history-mode fallback: unknown paths serve index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Never cache the service worker or manifest, so PWA updates land promptly.
    # (add_header ré-inclut le snippet : sinon nginx perdrait les en-têtes du serveur.)
    location = /sw.js {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache";
    }
    location = /manifest.webmanifest {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache";
    }

    # Long-cache fingerprinted assets.
    location /assets/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
}
