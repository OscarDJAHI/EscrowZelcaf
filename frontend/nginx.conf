server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA history-mode fallback: unknown paths serve index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Never cache the service worker or manifest, so PWA updates land promptly.
    location = /sw.js {
        add_header Cache-Control "no-cache";
    }
    location = /manifest.webmanifest {
        add_header Cache-Control "no-cache";
    }

    # Long-cache fingerprinted assets.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
}
